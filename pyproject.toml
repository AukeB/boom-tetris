[project]
name = "Boom-Tetris"
version = "0.1.0"
description = "Boom! Tetris!"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11.5",
    "pygame>=2.6.1",
    "ruamel-yaml>=0.18.11",
]

[dependency-groups]
dev = [
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[tool.ruff.lint]
select = [
    "I",    # isort-style import sorting
    "ANN",  # annotation rules
]

[tool.docstring_tailor]
line-length = 80
style = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # tests are not held to annotation rules

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
