WINDOW:
  # Defines the size of the space between fields and fields/border of the PyGame
  # window. Larger values mean less space/margin.
  RATIO_MARGIN_TO_WINDOW_HEIGHT: 40
  WIDTH: COMPUTED
  HEIGHT: COMPUTED
  MARGIN: COMPUTED
  COLOR:
    BACKGROUND: [255, 255, 255]

BOARD:
  DIMENSIONS:
    ROWS: 20
    COLS: 10
    ROWS_HIDDEN: 2
    ROWS_TOTAL: COMPUTED
  RECT:
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  COLOR:
    BACKGROUND: [55, 55, 55]
  CELL:
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  GRID_LINES:
    ENABLED: True
    LINE_COLOR: [180, 180, 180] 
    LINE_WIDTH: 1

FONT:
  SIZE_CELLS: 0.7 # Units: BOARD.CELL.HEIGHT. Font pixel size scales with the cell size.
  SIZE: COMPUTED # Units: pixels.
  COLOR: [255, 255, 255]

FIELDS:
  LINE_COUNTER:
    LABEL: "LINES"
    HEIGHT_CELLS: 2 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  SCORE:
    LABEL: "SCORE"
    HEIGHT_CELLS: 6 # Units: BOARD.CELL.HEIGHT
    WIDTH_CELLS: 8 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  NEXT:
    HEIGHT_CELLS: 4 # Units: BOARD.CELL.HEIGHT
    WIDTH_CELLS: 5 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  LEVEL:
    LABEL: "LEVEL"
    HEIGHT_CELLS: 3 # Units: BOARD.CELL.HEIGHT
    WIDTH_CELLS: 5 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
  STATISTICS:
    LABEL: "STATISTICS"
    HEIGHT_CELLS: 17 # Units: BOARD.CELL.HEIGHT
    WIDTH_CELLS: 9 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED  
  TYPE:
    LABEL: "TYPE"
    HEIGHT_CELLS: 2 # Units: BOARD.CELL.HEIGHT
    WIDTH_CELLS: 7 # Units: BOARD.CELL.HEIGHT
    LEFT: COMPUTED
    TOP: COMPUTED
    WIDTH: COMPUTED
    HEIGHT: COMPUTED
    
POLYOMINO:
  SIZE: 4
  COLOR: [200, 255, 200]
  ALL_SHAPES: COMPUTED
  SPAWN_POSITION: COMPUTED
  SPAWN_POSITION_NEXT: COMPUTED

DIRECTIONS:
  UP: [0, -1]
  DOWN: [0, 1]
  LEFT: [-1, 0]
  RIGHT: [1, 0]
  ROTATE_CLOCKWISE: 1
  ROTATE_COUNTERCLOCKWISE: -1

DAS:
  DIRECTIONS: ["LEFT", "RIGHT", "DOWN"]
  DAS_DELAY_NTSC: 16
  DAS_DELAY_PAL: 12
  AUTO_REPEAT_RATE_NTSC: 6
  AUTO_REPEAT_RATE_PAL: 4

SCORE:
  SINGLE: 40 # Level 0 score value. Points scale linearly with the level number.
  DOUBLE_MULTIPLIER: 2.5 # A double is worth 2.5 times a single.
  TRIPLE_MULTIPLIER: 3 # A triple is worth 3 times a double.
  TETRIS_MULTIPLIER: 4 # A tetris is worth 4 times a triple.
  SOFT_DROP_PER_LINE: 1
  HARD_DROP_PER_LINE: 1

ARE:
  # Entry/appearance delay after a piece locks, in frames. The delay is longer for
  # pieces that lock high on the board and shorter for pieces that land near the floor.
  BASE_DELAY_FRAMES: 18 # Max delay, applied to the highest placements.
  MIN_DELAY_FRAMES: 10 # Floor delay, applied to the lowest placements.
  FIRST_THRESHOLD_ROW: 6 # Lock rows at or above this (0 = top) get the full delay.
  ROWS_PER_STEP: 4 # Every this many rows lower reduces the delay by one step.
  FRAMES_PER_STEP: 2 # Frames removed per step.

GENERAL:
  START_LEVEL: 18
  SOFT_DROP_SPEED: 0.5 # Units: Gravity. Definition of gravity: Gravity is expressed in unit G, where 1G = 1 cell per frame, and 0.1G = 1 cell per 10 frames
  NTSC_FRAMERATE: 60.0988
  PAL_FRAMERATE: 50.0070
  NTSC_DROP_FRAMES:
    0: 48
    1: 43
    2: 38
    3: 33
    4: 28
    5: 23
    6: 18
    7: 13
    8: 8
    9: 6
    10: 5
    13: 4
    16: 3
    19: 2
    29: 1
  PAL_DROP_FRAMES:
    0: 36
    1: 32
    2: 29
    3: 25
    4: 22
    5: 18
    6: 15
    7: 11
